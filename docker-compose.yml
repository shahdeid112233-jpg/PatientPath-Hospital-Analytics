services:
  hospital-dashboard:
    build:
      context: ./hospital_analytics
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./hospital_analytics/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./hospital_analytics:/opt/dbt/hospital_analytics
      - /home/shahd/.dbt:/home/airflow/.dbt:ro
    restart: unless-stopped
